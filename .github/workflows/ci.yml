name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: test (every package and the examples, against a fake ingest)
        if: runner.os != 'Windows'
        run: pnpm test
      # The examples stop on SIGTERM, as containers stop apps, and the test checks what they send
      # then: Windows has no SIGTERM to send them. The packages are tested there.
      - name: test (every package)
        if: runner.os == 'Windows'
        run: node --conditions=fixwire-source --test "packages/*/test/*.test.ts"

  oldest-node:
    name: Node 20 (the built package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Node 20 can't run the TypeScript tests; the built package is what apps run there.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/smoke.mjs

  react-18:
    name: React 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: install, with React 18 in place of 19
        run: |
          printf '\noverrides:\n  react: ^18.3.1\n  react-dom: ^18.3.1\n  "@types/react": ^18.3.0\n  "@types/react-dom": ^18.3.0\n' >> pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
      - run: node --conditions=fixwire-source --test "packages/react/test/*.test.ts"

  checks:
    name: lint, types, build, pack, size, licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm smoke
      - run: pnpm pack-check
      - run: pnpm typecheck:consumer
      - run: pnpm size
      - run: pnpm run license-gate
